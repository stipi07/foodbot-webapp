<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бот для питания</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 16px 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .user-info {
            font-size: 14px;
            opacity: 0.7;
        }
        button {
            background: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>🍳 Бот для питания</h1>

    <div class="card">
        <div>Привет, <b id="username">друг</b>!</div>
        <div class="user-info">Это твоё мини-приложение. Скоро здесь будет холодильник и рецепты.</div>
    </div>

    <button onclick="testClick()">Проверить связь с ботом</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('username').textContent =
                user.first_name || user.username || 'друг';
        }

        function testClick() {
            tg.showAlert('Привет из Mini App!');
        }
    </script>
</body>
</html>
