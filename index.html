<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Холодильник</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }
        h1 { font-size: 20px; margin: 0 0 16px 0; }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .label { font-size: 14px; opacity: 0.7; margin-bottom: 8px; }
        input[type=text] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            font-size: 16px;
            margin-bottom: 8px;
        }
        button {
            background: var(--tg-theme-button-color, #2ea6ff);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            margin-top: 4px;
        }
        button:active { opacity: 0.8; }
        button.secondary {
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            color: var(--tg-theme-text-color, #000);
        }
        .hint {
            font-size: 13px;
            opacity: 0.6;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <h1>🧊 Холодильник</h1>

    <div class="card">
        <div class="label">Что добавить?</div>
        <input type="text" id="product" placeholder="яйца, молоко, мука" autocomplete="off">
        <button onclick="addProduct()">Добавить</button>
    </div>

    <button class="secondary" onclick="openPantry()">📋 Показать холодильник</button>
    <button class="secondary" onclick="openCan()">🍳 Что можно приготовить?</button>

    <div class="hint">После действия приложение закроется — ответ придёт в чат</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const BOT = 'nsdt01bot';

        function toBase64(str) {
            const utf8 = unescape(encodeURIComponent(str));
            return btoa(utf8)
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

               function goToStart(param) {
            const url = 'https://t.me/' + BOT + '?start=' + param;
            tg.openTelegramLink(url);
        }

        function addProduct() {
            const input = document.getElementById('product');
            const value = input.value.trim();
            if (!value) {
                tg.showAlert('Введи продукт');
                return;
            }
            const encoded = toBase64(value);
            goToStart('b64_' + encoded);
        }

        function openPantry() {
            goToStart('pantry');
        }

        function openCan() {
            goToStart('can');
        }
    </script>
</body>
</html>
